name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A missing key does not break the build — it silently ships a contact
      # form that opens the visitor's mail client instead of sending. Fail here
      # instead, so a green run means the form actually works.
      - name: Check the contact-form key reached this job
        env:
          KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY || vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::NEXT_PUBLIC_WEB3FORMS_KEY is empty in the build job, so the contact form would ship in mailto-fallback mode. Add it under Settings -> Secrets and variables -> Actions -> Secrets -> Repository secrets. An *environment* secret will not work here: this job declares no environment, and GitHub only injects environment secrets into jobs that do."
            exit 1
          fi

      - run: npm run build
        env:
          # Read either namespace, so a value added under the Variables tab
          # rather than Secrets still reaches the build.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY || vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
          NEXT_PUBLIC_GITHUB_USER: ${{ vars.NEXT_PUBLIC_GITHUB_USER || github.repository_owner }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
